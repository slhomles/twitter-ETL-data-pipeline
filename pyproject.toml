[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "style-finetuning-pipeline"
version = "0.1.0"
description = "Rights-gated dataset, QLoRA training, evaluation, and guarded serving pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Project contributors"}]
dependencies = []

[project.optional-dependencies]
data = [
  "boto3>=1.34",
  "fsspec>=2024.6",
  "s3fs>=2024.6",
]
train = [
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "datasets>=3.0",
  "mlflow>=2.17",
  "peft>=0.13",
  "torch>=2.4",
  "transformers>=4.46",
  "trl>=0.12",
]
serve = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn[standard]>=0.30",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
style-pipeline = "style_finetuning.cli:main"
style-train = "style_finetuning.training.train_sft:main"
style-evaluate = "style_finetuning.evaluation.cli:main"
style-api = "style_finetuning.serving.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
